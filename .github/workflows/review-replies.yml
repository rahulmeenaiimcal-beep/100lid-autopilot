name: Review replies

# When you reply "ok", "now" or "no" on a video's review issue (or to its email),
# this schedules, publishes or keeps the video private.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: reply-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reply:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'review') &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Act on your reply
        env:
          ISSUE: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m robot reply --issue "$ISSUE" --text "$BODY"
      - name: Save the decision
        run: |
          git config user.name "autopilot-bot"
          git config user.email "autopilot-bot@users.noreply.github.com"
          git add data/decisions 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "decision on issue #${{ github.event.issue.number }}"
            for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && break; sleep $((i * 5)); done
          fi
