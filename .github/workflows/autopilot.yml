name: Autopilot

# ---------------------------------------------------------------
# WHEN THE ROBOT RUNS (times are UTC; India = UTC + 5:30)
#   Every hour at :17  -> is a video due in the next ~2 days? If yes, make + upload it.
#   Every day 21:41    -> (3:11 am IST) read YouTube numbers, learn, post pinned comments
#   Every 3 days 01:11 -> (6:41 am IST) the plain-language report (sent to you as an issue/email)
# You can also run it by hand: Actions tab -> Autopilot -> Run workflow.
# ---------------------------------------------------------------
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "41 21 * * *"
    - cron: "11 1 */3 * *"
  workflow_dispatch:
    inputs:
      job:
        description: "What should the robot do?"
        type: choice
        options: [check, sample, auto, long, short, stats, report]
        default: check
      upload:
        description: "Upload to YouTube? (untick = only make the video file to download)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Decide what to do
        id: plan
        run: |
          pip install -q pyyaml tzdata
          HEAVY=no
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "41 21 * * *") JOB=stats ;;
              "11 1 */3 * *") JOB=report ;;
              *) JOB=auto; WHAT=$(python -m robot.due); [ "$WHAT" != "none" ] && HEAVY=yes ;;
            esac
            FLAG=""
          else
            JOB="${{ inputs.job }}"
            if [ "${{ inputs.upload }}" = "true" ]; then FLAG="--upload"; else FLAG="--no-upload"; fi
            case "$JOB" in sample|auto|long|short) HEAVY=yes ;; esac
            [ "$JOB" = "auto" ] && FLAG=""
          fi
          echo "job=$JOB" >> "$GITHUB_OUTPUT"
          echo "flag=$FLAG" >> "$GITHUB_OUTPUT"
          echo "heavy=$HEAVY" >> "$GITHUB_OUTPUT"
          echo "job=$JOB flag=$FLAG heavy=$HEAVY"

      - name: Install Python packages
        run: pip install -q -r requirements.txt

      # ffmpeg (sound mixing). If GitHub's download servers are slow, a ready-made copy is used instead.
      - name: Install video tools
        if: steps.plan.outputs.heavy == 'yes' || steps.plan.outputs.job == 'check'
        timeout-minutes: 15
        run: |
          if command -v ffmpeg >/dev/null; then echo "ffmpeg already installed"; exit 0; fi
          sudo rm -f /var/lib/man-db/auto-update
          if sudo timeout 400 apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null; then exit 0; fi
          if sudo timeout 180 apt-get update -qq && sudo timeout 400 apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null; then exit 0; fi
          mkdir -p /tmp/ff && cd /tmp/ff
          curl -fsSL --retry 3 --max-time 240 -o ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ff.tar.xz && sudo cp ffmpeg-*-static/ffmpeg ffmpeg-*-static/ffprobe /usr/local/bin/

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.heavy == 'yes'
        with:
          node-version: "22"

      - name: Cache the animation engine
        if: steps.plan.outputs.heavy == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            video/node_modules
            ~/.cache/remotion
          key: remotion-${{ runner.os }}-${{ hashFiles('video/package.json', 'video/package-lock.json') }}

      - name: Install the animation engine (Remotion)
        if: steps.plan.outputs.heavy == 'yes'
        working-directory: video
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund || npm install --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx --no-install remotion browser ensure

      # Optional open-source Hindi voices (only when config.yaml says engine: parler or auto)
      - name: Install open-source voices
        if: steps.plan.outputs.heavy == 'yes'
        run: |
          if grep -Eq '^\s*engine:\s*"?(parler|auto)' config.yaml; then
            pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            pip install -q "git+https://github.com/huggingface/parler-tts.git" transformers
          else
            echo "Using Microsoft voices (engine: edge) - nothing to install"
          fi

      - name: Cache open-source voice model
        if: steps.plan.outputs.heavy == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-indic-parler-v1

      - name: Run the robot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m robot ${{ steps.plan.outputs.job }} ${{ steps.plan.outputs.flag }}

      # Copies of the finished videos: open this run's page and download them under "Artifacts".
      - name: Keep the videos for 5 days (download from this page)
        if: always() && steps.plan.outputs.heavy == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*.jpg
            out/*.srt
            work/*.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Save the robot's memory
        if: always()
        run: |
          git config user.name "autopilot-bot"
          git config user.email "autopilot-bot@users.noreply.github.com"
          git add video/package-lock.json 2>/dev/null || true
          if [ "${{ steps.plan.outputs.flag }}" != "--no-upload" ] && [ "${{ steps.plan.outputs.job }}" != "check" ]; then
            git add -A data
          fi
          if ! git diff --cached --quiet; then
            git commit -q -m "data: ${{ steps.plan.outputs.job }} run ${{ github.run_number }}"
            for i in 1 2 3 4 5; do
              git pull -q --rebase -X theirs origin main && git push -q && break
              echo "push failed, retrying"; sleep $((i * 7))
            done
          fi
